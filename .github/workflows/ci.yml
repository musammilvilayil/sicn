name: SICN CI

on:
  push:
    branches:
      - main
      - feat/sicn-complete-mobile-ar-admin-redesign
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Run frontend indoor navigation unit tests
        run: npm run test:unit
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Verify original floor-plan PDFs are bundled
        run: |
          test -s dist/floorplans/ground-floor.pdf
          test -s dist/floorplans/first-floor.pdf
          test -s dist/floorplans/second-third-floor.pdf
          test -s dist/floorplans/fourth-fifth-floor.pdf
          test -s dist/floorplans/sixth-seventh-floor.pdf
        working-directory: frontend

  backend:
    name: Backend syntax and dependency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Check JavaScript syntax
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
        working-directory: backend
      - name: Run backend routing and measurement unit tests
        run: npm run test:unit
        working-directory: backend
      - name: Audit architectural measurements and graph integrity
        run: npm run audit:geometry
        working-directory: backend

  floorplan-extraction:
    name: Extract floor-plan PDF text and vector candidates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF extraction dependency
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.5
      - name: Test PDF extraction
        run: python -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Extract source PDF geometry candidates
        run: python tools/extract_floorplan_geometry.py --input-dir floorplan --output-dir artifacts/floorplan-extraction
      - name: Upload extraction report and page previews
        uses: actions/upload-artifact@v4
        with:
          name: floorplan-vector-extraction
          path: artifacts/floorplan-extraction/
          if-no-files-found: error
          retention-days: 14
